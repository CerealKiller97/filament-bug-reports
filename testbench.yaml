providers:
    - CerealKiller97\FilamentBugReports\BugReportsServiceProvider
    - Workbench\App\Providers\WorkbenchServiceProvider
    - Workbench\App\Providers\AdminPanelProvider

seeders:
    - Workbench\Database\Seeders\DatabaseSeeder

workbench:
    start: /
    install: true
    discovers:
        web: true
    build:
        - asset-publish
        - create-sqlite-db
        - db-wipe
        - migrate-fresh:
            '--seed': true
            '--seeder': 'Workbench\Database\Seeders\DatabaseSeeder'

database:
    path: "workbench/database/database.sqlite"

build:
    - touch workbench/database/database.sqlite
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
