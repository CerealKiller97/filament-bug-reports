version: 2
updates:
  # PHP / Composer dependencies for the plugin itself.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer-dev:
        dependency-type: development
        update-types:
          - minor
          - patch

  # npm dependencies for the documentation site.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docs-minor-patch:
        update-types:
          - minor
          - patch

  # The GitHub Actions used by the workflows. Dependabot bumps the pinned
  # commit SHAs and keeps the `# vX.Y.Z` comments in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
