name: type coverage

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: type-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-coverage:
    runs-on: ubuntu-latest

    name: Type coverage

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo, sqlite3, pdo_sqlite
          # The type-coverage analyser blows past the default 128M limit.
          ini-values: memory_limit=-1
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run type coverage
        run: vendor/bin/pest --type-coverage --min=100
